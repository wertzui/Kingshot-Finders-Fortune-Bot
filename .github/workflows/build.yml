name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/KingshotFindersFortuneBot/KingshotFindersFortuneBot.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'No <Version> found in the project file.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/KingshotFindersFortuneBot/KingshotFindersFortuneBot.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Create zip
        shell: pwsh
        run: |
          Get-ChildItem publish -File | Where-Object { $_.Extension -ne '.exe' } | Remove-Item
          Compress-Archive -Path publish/* -DestinationPath "Kingshot-Finders-Fortune-Bot-${{ steps.version.outputs.version }}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Kingshot-Finders-Fortune-Bot-${{ steps.version.outputs.version }}-win-x64
          path: Kingshot-Finders-Fortune-Bot-*.zip

  # Only runs on the main branch, never for pull requests.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $tag already exists. Increase <Version> in the project file to create a new release."
            exit 0
          fi
          gh release create "$tag" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
